Include.pcm_split.File "/common/pcm/split.conf"

Macro.playback.SplitPCM {
	Name "rodecaster_pro_ii_stereo_out"
	Direction Playback
	Channels 2
	HWChannels 10
	HWChannelPos0 FL	# System Out Left
	HWChannelPos1 FR	# System Out Left
	HWChannelPos2 FL	# Game Out Left
	HWChannelPos3 FR	# Game Out Right
	HWChannelPos4 FL	# Music Out Left
	HWChannelPos5 FR	# Music Out Right
	HWChannelPos6 FL	# Virtual A Out Left
	HWChannelPos7 FR	# Virtual A Out Right
	HWChannelPos8 FL	# Virtual B Out Left
	HWChannelPos9 FR	# Virtual B Out Right
}

Macro.capture.SplitPCM {
	Name "rodecaster_pro_ii_stereo_in"
	Direction Capture
	Channels 2
	HWChannels 16

	HWChannelPos0  FL		# Mix In Left
	HWChannelPos1  FR		# Mix In Right

	HWChannelPos2  MONO		# Combo 1 In
	HWChannelPos3  MONO		# Combo 2 In
	HWChannelPos4  MONO		# Combo 3 In
	HWChannelPos5  MONO		# Combo 4 In

	HWChannelPos6  FL		# Bluetooth In Left
	HWChannelPos7  FR		# Bluetooth In Right
	HWChannelPos8  FL		# SMART Pads In Left
	HWChannelPos9  FR		# SMART Pads In Right
	HWChannelPos10 FL		# System In Left
	HWChannelPos11 FR		# System In Right
	HWChannelPos12 FL		# Chat In Left
	HWChannelPos13 FR		# Chat In Right
	HWChannelPos14 FL		# USB 2 In Left
	HWChannelPos15 FR		# USB 2 In Right
}

SectionDevice."Speaker" {
	Comment "System"

	Value {
		PlaybackPriority 400
	}
	Macro.pcm_split.SplitPCMDevice {
		Name "rodecaster_pro_ii_stereo_out"
		Direction Playback
		HWChannels 10
		Channels 2
		Channel0 0
		Channel1 1
		ChannelPos0 FL
		ChannelPos1 FR
	}
}

